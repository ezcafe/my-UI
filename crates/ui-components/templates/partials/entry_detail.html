<div class="flex flex-col h-full w-full" data-entry-id="{{ entry.id }}">
  <!-- Detail Header: fixed h-8 matching skeleton, full parent width, no border, no vertical jump -->
  <div class="flex items-center justify-between mb-6 shrink-0 w-full h-8">
    <button 
      id="detail-back-btn"
      onclick="closeDetailPanel()" 
      class="h-8 px-3 inline-flex items-center gap-1.5 rounded-full bg-primary text-primary-foreground text-xs font-bold hover:opacity-90 transition-opacity shrink-0">
      <i data-lucide="chevron-left" class="w-4 h-4 shrink-0"></i>
      <span>Back</span>
    </button>

    <div class="flex items-center gap-2 h-8 shrink-0">
      <a 
        href="{{ entry.url }}" 
        target="_blank" 
        rel="noopener noreferrer" 
        onclick="markArticleRead({{ entry.id }})" 
        class="h-8 px-3 inline-flex items-center gap-1.5 rounded-full border border-border bg-card hover:bg-muted text-xs font-medium text-foreground transition-colors shrink-0">
        <span>Original</span>
        <i data-lucide="external-link" class="w-3.5 h-3.5 shrink-0"></i>
      </a>

      {% if auth_enabled %}
      <!-- Mark as unread button (precedes bookmark button) -->
      <button 
        hx-post="/hx/entries/{{ entry.id }}/read?status=unread" 
        hx-target="#entry-{{ entry.id }}" 
        hx-swap="outerHTML" 
        class="w-8 h-8 inline-flex items-center justify-center rounded-full border border-border bg-card hover:bg-muted text-muted-foreground hover:text-foreground transition-colors shrink-0"
        title="Mark as unread">
        <i data-lucide="circle-dot" class="w-4 h-4 shrink-0"></i>
      </button>

      <button 
        hx-post="/hx/entries/{{ entry.id }}/bookmark" 
        hx-target="this" 
        hx-swap="outerHTML" 
        class="w-8 h-8 inline-flex items-center justify-center rounded-full border border-border bg-card hover:bg-muted text-muted-foreground hover:text-foreground transition-colors shrink-0"
        title="Toggle bookmark">
        {% if entry.is_bookmarked %}
        <i data-lucide="bookmark" class="w-4 h-4 fill-foreground text-foreground shrink-0"></i>
        {% else %}
        <i data-lucide="bookmark" class="w-4 h-4 shrink-0"></i>
        {% endif %}
      </button>
      {% else %}
      <button 
        id="detail-toggle-read-btn"
        onclick="toggleLocalReadStatus({{ entry.id }})" 
        class="w-8 h-8 inline-flex items-center justify-center rounded-full border border-border bg-card hover:bg-muted text-muted-foreground hover:text-foreground transition-colors shrink-0"
        title="Toggle read status">
        <i data-lucide="circle-dot" class="w-4 h-4 shrink-0"></i>
      </button>

      <button 
        onclick="triggerNativeBookmark(this.dataset.title, this.dataset.url)" 
        data-title="{{ entry.title }}"
        data-url="{{ entry.url }}"
        class="w-8 h-8 inline-flex items-center justify-center rounded-full border border-border bg-card hover:bg-muted text-muted-foreground hover:text-foreground transition-colors shrink-0"
        title="Bookmark article">
        <i data-lucide="bookmark" class="w-4 h-4 shrink-0"></i>
      </button>
      {% endif %}
    </div>
  </div>

  <!-- Detail Body: smaller scrollbar, capped at max-w-[44rem] mx-auto -->
  <div class="detail-scrollbar detail-body flex-1 overflow-y-auto pr-2 w-full max-w-[44rem] mx-auto">
    <div class="flex items-center gap-2 text-xs text-muted-foreground mb-2 font-sans tabular">
      <span class="font-medium text-foreground">{{ entry.feed_title }}</span>
      <span>•</span>
      <span>{{ entry.published_at }}</span>
    </div>

    <h1 class="text-2xl font-bold font-sans text-foreground mb-6 leading-snug">
      {{ entry.title }}
    </h1>

    <div id="ai-rewrite-box" class="space-y-6">
      <!-- Inverted Pyramid Rewrite Content -->
      <div class="prose dark:prose-invert max-w-none text-foreground/90 text-sm leading-relaxed space-y-4 font-sans whitespace-pre-line">
        {{ rewrite }}
      </div>
    </div>

    {% if has_analysis %}
    {% include "analysis_cards.html" %}
    {% else %}
    <div id="ai-analysis-box" class="animate-pulse space-y-4 my-4" hx-get="/hx/entries/{{ entry.id }}/analysis" hx-trigger="load" hx-swap="outerHTML">
      <div class="rounded-lg p-4 bg-muted/30 border border-border space-y-2">
        <div class="h-4 bg-muted rounded w-1/4"></div>
        <div class="h-3 bg-muted rounded w-3/4"></div>
      </div>
      <div class="rounded-lg p-4 bg-muted/30 border border-border space-y-2">
        <div class="h-4 bg-muted rounded w-1/3"></div>
        <div class="h-3 bg-muted rounded w-5/6"></div>
      </div>
    </div>
    {% endif %}
  </div>
</div>
