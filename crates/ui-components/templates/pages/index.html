{% extends "base.html" %}

{% block title %}Feed | AR Spatial RSS{% endblock %}

{% block content %}
<div class="spatial-shell">
  <main class="spatial-window ar-glass-panel flex flex-col">
    <!-- Header -->
    <header class="h-14 px-6 border-b border-white/10 grid grid-cols-[1fr_auto_1fr] items-center shrink-0 select-none">
      <div class="flex items-center gap-2.5">
        <span class="font-semibold text-sm tracking-wide text-slate-200">Spatial RSS</span>
        <span id="unread-pill" class="px-2.5 py-0.5 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 font-semibold text-[11px]">
          {{ unread_count }} unread
        </span>
      </div>

      <div class="flex justify-center">
        <div class="spatial-grab-handle"></div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <button 
          id="mark-page-read-btn"
          type="button" 
          hx-post="/hx/mark-page-read" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="#active-status, [name='search']"
          hx-vals="js:{entry_ids: getVisibleEntryIds()}"
          class="p-2 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 transition-colors" 
          title="Mark This Page as Read">
          <i data-lucide="check-check" class="w-4 h-4"></i>
        </button>
        <a href="/auth/logout" class="p-2 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 transition-colors" title="Log Out">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </a>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="px-6 py-3 border-b border-white/5 flex items-center justify-between gap-4 bg-white/[0.02]">
      <input type="hidden" id="active-status" name="status" value="unread">
      <div class="flex items-center gap-2">
        {% if ai_enabled %}
        <button 
          id="filter-ai"
          data-status="ai"
          hx-get="/hx/entries?status=ai" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white/5 text-slate-400 hover:text-white border border-white/10 transition-colors flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-400"></i>
          AI
        </button>
        {% endif %}
        <button 
          id="filter-unread"
          data-status="unread"
          hx-get="/hx/entries?status=unread" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 hover:bg-indigo-500/30 transition-colors">
          Unread <span id="filter-unread-count" class="text-xs text-white/50">({{ unread_count }})</span>
        </button>
        <button 
          id="filter-today"
          data-status="today"
          hx-get="/hx/entries?status=today" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white/5 text-slate-400 hover:text-white border border-white/10 transition-colors">
          Today <span id="filter-today-count" class="text-xs text-white/50">({{ today_count }})</span>
        </button>
        <button 
          id="filter-starred"
          data-status="starred"
          hx-get="/hx/entries?status=starred" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white/5 text-slate-400 hover:text-white border border-white/10 transition-colors">
          Starred
        </button>
        <button 
          id="filter-all"
          data-status="all"
          hx-get="/hx/entries?status=all" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white/5 text-slate-400 hover:text-white border border-white/10 transition-colors">
          All Titles
        </button>
      </div>

      <!-- Hybrid Search Form -->
      <form 
        id="search-form" 
        hx-get="/hx/entries" 
        hx-target="#entries-list" 
        hx-swap="innerHTML"
        class="relative flex items-center"
        onsubmit="onSearchSubmit(event)"
      >
        <input 
          type="search" 
          id="search-input"
          name="search" 
          placeholder="Filter articles..." 
          oninput="filterArticlesClientSide(this.value)"
          class="bg-white/5 border border-white/10 rounded-full pl-3.5 pr-8 py-1 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-400/50 w-44"
        />
        <input type="hidden" name="status" value="all" />
        <button type="submit" class="absolute right-2.5 text-slate-400 hover:text-white" title="Search all articles">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </button>
      </form>
    </div>

    <!-- Main Content Area: Entries List + Detail Panel Container -->
    <div class="flex-1 flex overflow-hidden relative">
      <div id="entries-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        {{ entries_list_html|safe }}
      </div>

      <!-- Detail Slide-Over / Modal Panel -->
      <div id="detail-panel" class="hidden absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-2xl flex flex-col p-6 overflow-y-auto"></div>
    </div>
  </main>
</div>

<script>
  function setActiveFilter(btn) {
    document.querySelectorAll('.filter-pill').forEach(el => {
      el.classList.remove('bg-indigo-500/20', 'text-indigo-300', 'border-indigo-400/30', 'bg-white/10', 'text-white', 'border-white/20');
      el.classList.add('bg-white/5', 'text-slate-400', 'border-white/10');
    });
    btn.classList.add('bg-indigo-500/20', 'text-indigo-300', 'border-indigo-400/30');
    btn.classList.remove('bg-white/5', 'text-slate-400');
    const status = btn.getAttribute('data-status');
    const statusInput = document.getElementById('active-status');
    if (status && statusInput) {
      statusInput.value = status;
    }
  }

  function filterArticlesClientSide(query) {
    const q = (query || '').toLowerCase().trim();
    const items = document.querySelectorAll('#entries-list .ar-list-item');
    items.forEach(item => {
      const titleEl = item.querySelector('.article-title') || item;
      const title = titleEl.textContent.toLowerCase();
      if (!q || title.includes(q)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  }

  function getVisibleEntryIds() {
    const items = document.querySelectorAll('#entries-list .ar-list-item');
    const ids = [];
    items.forEach(item => {
      if (item.style.display !== 'none') {
        const id = item.getAttribute('data-entry-id') || (item.id ? item.id.replace('entry-', '') : null);
        if (id) ids.push(id);
      }
    });
    return ids.join(',');
  }

  function onSearchSubmit(event) {
    // Allows HTMX to proceed with GET /hx/entries?search=...&status=all
  }

  function openDetailWithSkeleton() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    
    panel.innerHTML = `
      <div class="flex flex-col h-full animate-pulse select-none">
        <!-- Skeleton Header -->
        <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-6 shrink-0">
          <button 
            type="button"
            onclick="closeDetailPanel()" 
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-xs font-medium text-slate-300 transition-colors pointer-events-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
          </button>
          <div class="flex items-center gap-2">
            <div class="h-7 w-20 bg-white/10 rounded-full"></div>
            <div class="w-8 h-8 rounded-full bg-white/10"></div>
            <div class="w-8 h-8 rounded-full bg-white/10"></div>
          </div>
        </div>

        <!-- Skeleton Body -->
        <div class="flex-1 overflow-y-auto pr-2 space-y-4">
          <!-- Feed info & date -->
          <div class="flex items-center gap-2 mb-2">
            <div class="h-3.5 bg-indigo-400/30 rounded w-28"></div>
            <div class="h-3.5 bg-white/10 rounded w-16"></div>
          </div>

          <!-- Title placeholder -->
          <div class="space-y-2 mb-6">
            <div class="h-6 bg-white/20 rounded-lg w-4/5"></div>
            <div class="h-6 bg-white/15 rounded-lg w-2/3"></div>
          </div>

          <!-- AI Brief Card Skeleton -->
          <div class="rounded-2xl border border-white/10 bg-white/[0.03] p-4 space-y-2.5">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-4 h-4 rounded bg-indigo-400/40"></div>
              <div class="h-3.5 bg-white/20 rounded w-24"></div>
            </div>
            <div class="h-3 bg-white/10 rounded w-full"></div>
            <div class="h-3 bg-white/10 rounded w-5/6"></div>
          </div>

          <!-- Prose Content Skeleton Lines -->
          <div class="space-y-3 pt-2">
            <div class="h-4 bg-white/10 rounded w-full"></div>
            <div class="h-4 bg-white/10 rounded w-11/12"></div>
            <div class="h-4 bg-white/10 rounded w-4/5"></div>
            <div class="h-4 bg-white/10 rounded w-full"></div>
            <div class="h-4 bg-white/10 rounded w-3/4"></div>
          </div>
        </div>
      </div>
    `;
    panel.classList.remove('hidden');
  }

  function closeDetailPanel() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    panel.classList.add('hidden');
    panel.innerHTML = '';
  }
</script>
{% endblock %}
