{% extends "base.html" %}

{% block title %}Login | AR Spatial RSS{% endblock %}

{% block content %}
<div class="spatial-shell">
  <main class="spatial-window ar-glass-panel flex flex-col justify-center items-center p-8 text-center max-w-md">
    <div class="spatial-grab-handle mb-8 opacity-60"></div>
    <div class="w-16 h-16 rounded-2xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/10">
      <i data-lucide="radio" class="w-8 h-8 text-indigo-400"></i>
    </div>
    <h1 class="text-2xl font-bold tracking-tight mb-2">AR Spatial RSS</h1>
    <p class="text-sm text-slate-400 mb-8 max-w-xs">Connect your Pocket-ID account to access your curated feeds in an immersive spatial interface.</p>
    <a href="/auth/login" class="inline-flex items-center gap-2.5 px-6 py-3 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-600/30 hover:scale-[1.02]">
      <span>Sign in with Pocket-ID</span>
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
  </main>
</div>
{% endblock %}
