<div class="space-y-6">
  {% for group in groups %}
  <div class="feed-group">
    <div class="flex items-center gap-2 mb-3 px-1">
      <i data-lucide="rss" class="w-4 h-4 text-foreground"></i>
      <h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground font-sans">{{ group.feed_title }}</h3>
    </div>
    <div class="space-y-3">
      {% for item in group.entries %}
      <div class="rounded-lg border border-border bg-card p-4 transition-colors hover:border-foreground/30">
        <div class="flex items-start justify-between gap-3">
          <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" class="text-sm font-medium font-sans text-foreground hover:text-foreground/80 transition-colors line-clamp-2">
            {{ item.title }}
          </a>
          <span class="text-xs text-muted-foreground whitespace-nowrap tabular font-sans">{{ item.published_at }}</span>
        </div>
        <div class="mt-3">
          <div id="ai-summary-slot-{{ item.id }}"
               class="ai-summary-slot pt-3 border-t border-border"
               hx-get="/hx/entries/{{ item.id }}/ai-summary"
               hx-trigger="revealed"
               hx-swap="outerHTML">
            <div class="animate-pulse motion-reduce:animate-none space-y-1.5 py-1">
              <span class="sr-only">Generating summary...</span>
              <div class="h-2.5 bg-muted rounded w-5/6" aria-hidden="true"></div>
              <div class="h-2.5 bg-muted rounded w-3/5" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
