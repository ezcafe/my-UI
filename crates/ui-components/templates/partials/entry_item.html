<div class="annuaire-row ar-list-item relative px-4 py-2.5 rounded-lg flex items-center justify-between gap-3 cursor-pointer select-none group hover:bg-muted/60 transition-colors border-b border-border/60 last:border-b-0" id="entry-{{ entry.id }}" data-entry-id="{{ entry.id }}">
  <!-- 3px vertical positional red bar (Rule 1: Red marks position, never action) -->
  <div id="entry-{{ entry.id }}-bar" class="w-[3px] self-stretch rounded-full shrink-0 {% if !entry.is_read %}bg-brand{% else %}bg-transparent{% endif %}"></div>

  <div class="flex items-center gap-2.5 flex-1 min-w-0" onclick="openEntryDetail({{ entry.id }})">
    <span id="entry-{{ entry.id }}-dot">
    {% if !entry.is_read %}
    <span class="w-2 h-2 rounded-full bg-brand shrink-0" title="Unread"></span>
    {% endif %}
    </span>
    <span class="article-title text-sm font-medium font-sans leading-snug line-clamp-2 text-foreground group-hover:text-foreground/80 transition-colors">
      {{ entry.title }}
    </span>
  </div>

  <div class="flex items-center gap-1.5 shrink-0">
    <a 
      href="{{ entry.url }}" 
      target="_blank" 
      rel="noopener noreferrer" 
      onclick="event.stopPropagation(); markArticleRead({{ entry.id }})" 
      class="p-1.5 rounded-full hover:bg-muted text-muted-foreground hover:text-foreground transition-colors"
      title="Open in browser">
      <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
    </a>
    <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-muted-foreground/60 group-hover:text-foreground transition-colors"></i>
  </div>
</div>
{% if let Some(unread) = unread_count %}
<span id="unread-pill" hx-swap-oob="true" data-base-unread="{{ unread }}" class="px-2.5 py-0.5 rounded-full bg-muted border border-border text-foreground font-bold text-xs tabular">
  {{ unread }} unread
</span>
{% endif %}
