<div class="space-y-6">
  {% for group in groups %}
  <div class="feed-group">
    <div class="flex items-center gap-2 mb-3 px-1">
      <i data-lucide="rss" class="w-4 h-4 text-indigo-400"></i>
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ group.feed_title }}</h3>
    </div>
    <div class="space-y-3">
      {% for item in group.entries %}
      <div class="ar-glass-panel rounded-xl border border-white/10 p-4 transition-all hover:border-white/20">
        <div class="flex items-start justify-between gap-3">
          <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-slate-200 hover:text-indigo-300 transition-colors line-clamp-2">
            {{ item.title }}
          </a>
          <span class="text-[11px] text-slate-500 whitespace-nowrap">{{ item.published_at }}</span>
        </div>
        <div class="ai-summary-slot mt-3 pt-3 border-t border-white/5"
             hx-get="/hx/entries/{{ item.id }}/ai-summary"
             hx-trigger="revealed"
             hx-swap="outerHTML">
          <div class="skeleton-pulse text-xs text-indigo-300/60 flex items-center gap-2 py-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 animate-spin"></i>
            <span>Generating brief...</span>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
