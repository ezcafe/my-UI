{% extends "base.html" %}

{% block title %}Directory | My News{% endblock %}

{% block content %}
<div class="spatial-shell">
  <main class="spatial-window flex flex-col bg-card border border-border">
    <!-- Header -->
    <header class="h-14 px-6 border-b border-border grid grid-cols-[1fr_auto_1fr] items-center shrink-0 select-none bg-card">
      <div class="flex items-center gap-3">
        <span class="font-display text-xl font-bold uppercase tracking-wider text-brand">My News</span>
      </div>

      <div class="flex justify-center">
        <div class="w-12 h-1 bg-border rounded-full"></div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <!-- Theme Switcher (Frontier Q2: Sun/Moon toggle with OS auto-detect) -->
        <button 
          id="theme-toggle-btn"
          type="button" 
          onclick="toggleTheme()" 
          class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" 
          title="Toggle light/dark theme">
          <i data-lucide="sun" id="theme-icon-sun" class="w-4 h-4 hidden"></i>
          <i data-lucide="moon" id="theme-icon-moon" class="w-4 h-4"></i>
        </button>

        {% if auth_enabled %}
        <button 
          id="mark-page-read-btn"
          type="button" 
          hx-post="/hx/mark-page-read" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="#active-status, [name='search']"
          hx-vals="js:{entry_ids: getVisibleEntryIds()}"
          class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" 
          title="Mark This Page as Read">
          <i data-lucide="check-check" class="w-4 h-4"></i>
        </button>
        {% else %}
        <button 
          id="mark-page-read-btn"
          type="button" 
          onclick="markVisiblePageLocallyRead()" 
          class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" 
          title="Mark This Page as Read">
          <i data-lucide="check-check" class="w-4 h-4"></i>
        </button>
        {% endif %}
        {% if auth_enabled %}
        <a href="/auth/logout" class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" title="Log Out">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </a>
        {% endif %}
      </div>
    </header>

    <!-- Filter Bar & Search -->
    <div class="px-6 py-3 border-b border-border flex items-center justify-between gap-4 bg-muted/40">
      <input type="hidden" id="active-status" name="status" value="unread">
      <div class="flex items-center gap-2 overflow-x-auto min-w-0 shrink no-scrollbar py-0.5">
        <button 
          id="filter-unread"
          data-status="unread"
          type="button"
          hx-get="/hx/entries?status=unread" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-indicator="#entries-loading-bar"
          hx-include="[name='search']"
          onclick="handleFilterClick(this, event)"
          class="filter-pill whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold bg-primary text-primary-foreground border border-primary transition-colors shrink-0">
          Unread <span id="filter-unread-count" data-base-unread="{{ unread_count }}" class="text-xs tabular">({{ unread_count }})</span>
        </button>
        <button 
          id="filter-today"
          data-status="today"
          type="button"
          hx-get="/hx/entries?status=today" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-indicator="#entries-loading-bar"
          hx-include="[name='search']"
          onclick="handleFilterClick(this, event)"
          class="filter-pill whitespace-nowrap px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors shrink-0">
          Today <span id="filter-today-count" class="text-xs tabular">({{ today_count }})</span>
        </button>
        {% if auth_enabled %}
        <button 
          id="filter-starred"
          data-status="starred"
          type="button"
          hx-get="/hx/entries?status=starred" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-indicator="#entries-loading-bar"
          hx-include="[name='search']"
          onclick="handleFilterClick(this, event)"
          class="filter-pill whitespace-nowrap px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors shrink-0">
          Starred
        </button>
        {% endif %}
        <button 
          id="filter-all"
          data-status="all"
          type="button"
          {% if auth_enabled %}
          hx-get="/hx/entries?status=all" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-indicator="#entries-loading-bar"
          hx-include="[name='search']"
          {% endif %}
          onclick="handleFilterClick(this, event)"
          class="filter-pill whitespace-nowrap px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors shrink-0">
          All
        </button>
      </div>

      <!-- Annuaire Recipe 6.3: Search Form with .field and .field-button-hit-area -->
      <form 
        id="search-form" 
        hx-get="/hx/entries" 
        hx-target="#entries-list" 
        hx-swap="innerHTML"
        hx-indicator="#entries-loading-bar"
        class="relative flex items-center shrink-0"
        onsubmit="onSearchSubmit(event)"
      >
        <input 
          type="search" 
          id="search-input"
          name="search" 
          placeholder="Filter articles..." 
          oninput="filterArticlesClientSide(this.value)"
          class="field rounded-full border border-input bg-card pl-3.5 pr-8 py-1.5 text-xs text-foreground placeholder:text-muted-foreground w-48"
        />
        <input type="hidden" name="status" value="all" />
        <button type="submit" class="field-button-hit-area absolute right-2.5 text-muted-foreground hover:text-foreground" title="Search all articles">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </button>
      </form>
    </div>

    <!-- Main Content Area: Entries List + Detail Panel Container -->
    <div class="flex-1 flex overflow-hidden relative">
      <!-- Loading Indicator: Absolute zero-height overlay to prevent layout shift / pushing content -->
      <div id="entries-loading-bar" class="htmx-indicator h-0.5 bg-brand animate-pulse absolute top-0 left-0 right-0 z-20 pointer-events-none"></div>
      <div id="entries-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-1.5 bg-card">
        {{ entries_list_html|safe }}
      </div>

      <!-- Detail Slide-Over / Modal Panel (Annuaire: zero shadow, border-l border-border) -->
      <div id="detail-panel" class="detail-scrollbar hidden absolute inset-0 z-30 bg-card border-l border-border flex flex-col p-6 overflow-y-auto"></div>
    </div>
  </main>
</div>

<script>
  const FILTER_CACHE_TTL_MS = 60000;
  const filterCache = new Map();

  function invalidateFilterCache() {
    filterCache.clear();
  }

  function seedInitialFilterCache() {
    const entriesList = document.getElementById('entries-list');
    const activeStatus = document.getElementById('active-status');
    const searchInput = document.getElementById('search-input');
    const searchQuery = (searchInput && searchInput.value) ? searchInput.value.trim() : '';
    if (entriesList && activeStatus && activeStatus.value && !searchQuery) {
      filterCache.set(activeStatus.value, {
        timestamp: Date.now(),
        html: entriesList.innerHTML,
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', seedInitialFilterCache);
  } else {
    seedInitialFilterCache();
  }

  function applyCachedList(cachedHtml) {
    const entriesList = document.getElementById('entries-list');
    if (entriesList) {
      entriesList.innerHTML = cachedHtml;
      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons({ root: entriesList });
      }
      if (typeof syncDomReadStates === 'function') {
        syncDomReadStates();
      }
    }
  }

  function handleFilterClick(btn, event) {
    if (typeof closeDetailPanel === 'function') {
      closeDetailPanel();
    }
    const status = btn.getAttribute('data-status');
    const searchInput = document.getElementById('search-input');
    const searchQuery = (searchInput && searchInput.value) ? searchInput.value.trim() : '';

    if (status === 'all' && typeof renderLocalAllArticles === 'function') {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === 'function') {
          event.stopImmediatePropagation();
        }
      }
      setActiveFilter(btn);
      renderLocalAllArticles();
      return false;
    }

    if (!searchQuery && filterCache.has(status)) {
      const cached = filterCache.get(status);
      if (Date.now() - cached.timestamp < FILTER_CACHE_TTL_MS) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
        setActiveFilter(btn);
        applyCachedList(cached.html);
        return false;
      }
    }
    setActiveFilter(btn);
    return true;
  }

  // HTMX request interceptor: Cancel server request if valid client cache exists
  document.addEventListener('htmx:beforeRequest', (evt) => {
    const trigger = evt.detail && evt.detail.elt;
    if (trigger && trigger.classList && trigger.classList.contains('filter-pill')) {
      const status = trigger.getAttribute('data-status');
      if (status === 'all' && typeof renderLocalAllArticles === 'function') {
        evt.preventDefault();
        setActiveFilter(trigger);
        renderLocalAllArticles();
        return;
      }
      const searchInput = document.getElementById('search-input');
      const searchQuery = (searchInput && searchInput.value) ? searchInput.value.trim() : '';
      if (!searchQuery && filterCache.has(status)) {
        const cached = filterCache.get(status);
        if (Date.now() - cached.timestamp < FILTER_CACHE_TTL_MS) {
          evt.preventDefault();
          setActiveFilter(trigger);
          applyCachedList(cached.html);
        }
      }
    }
  });

  function setActiveFilter(btn) {
    if (typeof closeDetailPanel === 'function') {
      closeDetailPanel();
    }
    document.querySelectorAll('.filter-pill').forEach(el => {
      el.classList.remove('bg-primary', 'text-primary-foreground', 'font-bold', 'border-primary');
      el.classList.add('bg-muted', 'text-muted-foreground', 'border-border', 'font-medium');
    });
    btn.classList.remove('bg-muted', 'text-muted-foreground', 'border-border', 'font-medium');
    btn.classList.add('bg-primary', 'text-primary-foreground', 'font-bold', 'border-primary');
    const status = btn.getAttribute('data-status');
    const statusInput = document.getElementById('active-status');
    if (status && statusInput) {
      statusInput.value = status;
    }
  }

  function filterArticlesClientSide(query) {
    const q = (query || '').toLowerCase().trim();
    const items = document.querySelectorAll('#entries-list .annuaire-row, #entries-list .ar-list-item');
    let visibleCount = 0;
    items.forEach(item => {
      const titleEl = item.querySelector('.article-title') || item;
      const title = titleEl.textContent.toLowerCase();
      if (!q || title.includes(q)) {
        item.style.display = '';
        visibleCount++;
      } else {
        item.style.display = 'none';
      }
    });

    const pagination = document.querySelector('#entries-list nav[aria-label="Pagination"]');
    if (pagination) {
      if (q || visibleCount === 0) {
        pagination.style.display = 'none';
      } else {
        pagination.style.display = '';
      }
    }
  }

  function getVisibleEntryIds() {
    const items = document.querySelectorAll('#entries-list .annuaire-row, #entries-list .ar-list-item');
    const ids = [];
    items.forEach(item => {
      if (item.style.display !== 'none') {
        const id = item.getAttribute('data-entry-id') || (item.id ? item.id.replace('entry-', '') : null);
        if (id) ids.push(id);
      }
    });
    return ids.join(',');
  }

  function onSearchSubmit(event) {
    if (typeof closeDetailPanel === 'function') {
      closeDetailPanel();
    }
    // Allows HTMX to proceed with GET /hx/entries?search=...&status=all
  }

  const ARTICLE_DB_NAME = 'my_news_article_cache_db';
  const ARTICLE_STORE_NAME = 'cached_articles';
  const ARTICLE_CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

  function openArticleCacheDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(ARTICLE_DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(ARTICLE_STORE_NAME)) {
          db.createObjectStore(ARTICLE_STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  async function getCachedArticle(id) {
    try {
      const numId = Number(id);
      if (!numId) return null;
      const db = await openArticleCacheDb();
      return new Promise((resolve) => {
        const tx = db.transaction(ARTICLE_STORE_NAME, 'readonly');
        const store = tx.objectStore(ARTICLE_STORE_NAME);
        const req = store.get(numId);
        req.onsuccess = (e) => {
          const item = e.target.result;
          if (item && item.cached_at && (Date.now() - item.cached_at < ARTICLE_CACHE_TTL_MS)) {
            resolve(item);
          } else {
            if (item) {
              deleteCachedArticle(numId);
            }
            resolve(null);
          }
        };
        req.onerror = () => resolve(null);
      });
    } catch (e) {
      return null;
    }
  }

  async function saveCachedArticle(id, html) {
    try {
      const numId = Number(id);
      if (!numId || !html) return;
      const db = await openArticleCacheDb();
      const tx = db.transaction(ARTICLE_STORE_NAME, 'readwrite');
      tx.objectStore(ARTICLE_STORE_NAME).put({
        id: numId,
        html: html,
        cached_at: Date.now()
      });
    } catch (e) {
      console.warn('Could not cache article in IndexedDB', e);
    }
  }

  async function deleteCachedArticle(id) {
    try {
      const numId = Number(id);
      if (!numId) return;
      const db = await openArticleCacheDb();
      const tx = db.transaction(ARTICLE_STORE_NAME, 'readwrite');
      tx.objectStore(ARTICLE_STORE_NAME).delete(numId);
    } catch (e) {}
  }

  function markArticleRead(id) {
    const numId = Number(id);
    if (!numId) return;

    // Optimistic visual update
    const bar = document.getElementById('entry-' + numId + '-bar');
    if (bar) {
      bar.classList.remove('bg-brand');
      bar.classList.add('bg-transparent');
    }
    const dot = document.getElementById('entry-' + numId + '-dot');
    if (dot) {
      dot.innerHTML = '';
    }

    if (typeof markLocallyRead === 'function') {
      markLocallyRead(numId);
    } else if (window.htmx) {
      htmx.ajax('POST', '/hx/entries/' + encodeURIComponent(numId) + '/read', {
        target: '#entry-' + numId,
        swap: 'outerHTML'
      });
    }
  }

  async function openEntryDetail(id) {
    const numId = Number(id);
    if (!numId) return;

    // Check 30-day IndexedDB cache first
    let cached = null;
    try {
      cached = await getCachedArticle(numId);
    } catch (e) {
      console.warn('Error reading article cache:', e);
    }

    const panel = document.getElementById('detail-panel');
    if (!panel) return;

    // Update URL query parameter without full reload
    const currentUrl = new URL(window.location);
    if (currentUrl.searchParams.get('entry') !== String(numId)) {
      currentUrl.searchParams.set('entry', numId);
      history.pushState(null, '', currentUrl.pathname + '?' + currentUrl.searchParams.toString());
    }

    const hasAiEnabled = {% if ai_enabled %}true{% else %}false{% endif %};
    const isCacheValid = cached && cached.html && (!hasAiEnabled || cached.html.includes('Executive Brief'));

    if (isCacheValid) {
      // Instant render from cache - zero network request, zero skeleton flicker
      panel.innerHTML = cached.html;
      panel.classList.remove('hidden');

      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons({ root: panel });
      }
      if (window.htmx && typeof htmx.process === 'function') {
        htmx.process(panel);
      }

      // Mark locally read if guest mode
      if (typeof markLocallyRead === 'function') {
        markLocallyRead(numId);
      }

      // Visually update the unread accent bar and dot on the entry row
      const bar = document.getElementById('entry-' + numId + '-bar');
      if (bar) {
        bar.classList.remove('bg-brand');
        bar.classList.add('bg-transparent');
      }
      const dot = document.getElementById('entry-' + numId + '-dot');
      if (dot) {
        dot.innerHTML = '';
      }
    } else {
      // Cache miss or expired: show skeleton and fetch via HTMX
      openDetailWithSkeleton();
      htmx.ajax('GET', '/hx/entries/' + encodeURIComponent(numId), {
        target: '#detail-panel',
        swap: 'innerHTML'
      });
    }
  }

  function openDetailWithSkeleton() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    
    panel.innerHTML = `
      <div class="flex flex-col h-full animate-pulse select-none w-full">
        <!-- Skeleton Header: fixed h-8 matching real detail header, no vertical jump -->
        <div class="flex items-center justify-between mb-6 shrink-0 w-full h-8">
          <button 
            type="button"
            onclick="closeDetailPanel()" 
            class="h-8 px-3 inline-flex items-center gap-1.5 rounded-full bg-primary text-primary-foreground text-xs font-bold pointer-events-auto shrink-0">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
          </button>
          <div class="flex items-center gap-2 h-8 shrink-0">
            <div class="h-8 w-20 bg-muted rounded-full shrink-0"></div>
            <div class="w-8 h-8 rounded-full bg-muted shrink-0"></div>
            <div class="w-8 h-8 rounded-full bg-muted shrink-0"></div>
          </div>
        </div>

        <!-- Skeleton Body: centered and capped at max-w-[44rem] -->
        <div class="detail-scrollbar detail-body flex-1 overflow-y-auto pr-2 space-y-4 w-full max-w-[44rem] mx-auto">
          <!-- Feed info & date -->
          <div class="flex items-center gap-2 mb-2">
            <div class="h-3.5 bg-muted rounded w-28"></div>
            <div class="h-3.5 bg-muted rounded w-16"></div>
          </div>

          <!-- Title placeholder -->
          <div class="space-y-2 mb-6">
            <div class="h-6 bg-muted rounded w-4/5"></div>
            <div class="h-6 bg-muted rounded w-2/3"></div>
          </div>

          <!-- AI Brief Card Skeleton -->
          <div class="rounded-lg border border-border bg-muted/40 p-4 space-y-2.5">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-4 h-4 rounded bg-primary/20"></div>
              <div class="h-3.5 bg-muted rounded w-24"></div>
            </div>
            <div class="h-3 bg-muted rounded w-full"></div>
            <div class="h-3 bg-muted rounded w-5/6"></div>
          </div>

          <!-- Prose Content Skeleton Lines -->
          <div class="space-y-3 pt-2">
            <div class="h-4 bg-muted rounded w-full"></div>
            <div class="h-4 bg-muted rounded w-11/12"></div>
            <div class="h-4 bg-muted rounded w-4/5"></div>
            <div class="h-4 bg-muted rounded w-full"></div>
            <div class="h-4 bg-muted rounded w-3/4"></div>
          </div>
        </div>
      </div>
    `;
    panel.classList.remove('hidden');
  }

  function closeDetailPanel() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    panel.classList.add('hidden');
    panel.innerHTML = '';
    const url = new URL(window.location);
    if (url.searchParams.has('entry')) {
      url.searchParams.delete('entry');
      history.pushState(null, '', url.pathname + (url.search ? url.search : ''));
    } else if (window.location.pathname.startsWith('/entries/')) {
      history.pushState(null, '', '/');
    }
  }

  function checkUrlForEntry() {
    const urlParams = new URLSearchParams(window.location.search);
    let entryId = urlParams.get('entry');
    if (!entryId) {
      const match = window.location.pathname.match(/\/entries\/(\d+)/);
      if (match) {
        entryId = match[1];
      }
    }
    if (entryId) {
      openEntryDetail(entryId);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    checkUrlForEntry();
  });

  window.addEventListener('popstate', () => {
    const urlParams = new URLSearchParams(window.location.search);
    let entryId = urlParams.get('entry');
    if (!entryId) {
      const match = window.location.pathname.match(/\/entries\/(\d+)/);
      if (match) {
        entryId = match[1];
      }
    }
    if (entryId) {
      openEntryDetail(entryId);
    } else {
      closeDetailPanel();
    }
  });

  document.addEventListener('htmx:afterSwap', (evt) => {
    if (evt.detail && evt.detail.target) {
      const targetId = evt.detail.target.id || '';
      if (targetId === 'entries-list') {
        let status = null;
        if (evt.detail.elt && typeof evt.detail.elt.getAttribute === 'function') {
          status = evt.detail.elt.getAttribute('data-status');
        }
        if (!status) {
          const activeStatusInput = document.getElementById('active-status');
          status = activeStatusInput ? activeStatusInput.value : null;
        }
        const searchInput = document.getElementById('search-input');
        const searchQuery = (searchInput && searchInput.value) ? searchInput.value.trim() : '';
        if (status && !searchQuery) {
          filterCache.set(status, {
            timestamp: Date.now(),
            html: evt.detail.target.innerHTML,
          });
        }
        if (typeof syncDomReadStates === 'function') {
          syncDomReadStates();
        }
      } else if (targetId === 'detail-panel' || evt.detail.target.closest('#detail-panel')) {
        invalidateFilterCache();
        const panel = document.getElementById('detail-panel');
        if (panel) {
          const detail = panel.querySelector('[data-entry-id]');
          if (detail) {
            const entryId = detail.getAttribute('data-entry-id');
            // Do not cache error cards
            if (entryId && !panel.querySelector('.stroke-destructive')) {
              saveCachedArticle(entryId, panel.innerHTML);
            }
          }
        }
      } else if (targetId.startsWith('entry-')) {
        invalidateFilterCache();
      }
    }
  });

  document.addEventListener('htmx:responseError', (evt) => {
    if (evt.detail && evt.detail.target && evt.detail.target.id === 'detail-panel') {
      const status = evt.detail.xhr ? evt.detail.xhr.status : 500;
      const msg = status === 429 
        ? 'Too many requests. Please wait a moment and try again.'
        : 'Failed to load article. Please try again later.';
      evt.detail.target.innerHTML = `
        <div class="rounded-lg p-6 bg-card border border-border text-center flex flex-col items-center justify-center m-4">
          <div class="p-2.5 rounded-full bg-muted text-destructive mb-3">
            <svg class="w-6 h-6 stroke-destructive" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <h3 class="text-sm font-bold font-sans text-foreground mb-1">Could Not Load Article</h3>
          <p class="text-xs font-sans text-muted-foreground mb-4 max-w-sm">${msg}</p>
          <button onclick="closeDetailPanel()" class="px-4 py-2 rounded-full bg-primary text-primary-foreground text-xs font-bold font-sans">Back to List</button>
        </div>
      `;
    }
  });

  document.addEventListener('htmx:sendError', (evt) => {
    if (evt.detail && evt.detail.target && evt.detail.target.id === 'detail-panel') {
      evt.detail.target.innerHTML = `
        <div class="rounded-lg p-6 bg-card border border-border text-center flex flex-col items-center justify-center m-4">
          <div class="p-2.5 rounded-full bg-muted text-destructive mb-3">
            <svg class="w-6 h-6 stroke-destructive" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <h3 class="text-sm font-bold font-sans text-foreground mb-1">Network Connection Issue</h3>
          <p class="text-xs font-sans text-muted-foreground mb-4 max-w-sm">Unable to connect to the server. Please check your network connection.</p>
          <button onclick="closeDetailPanel()" class="px-4 py-2 rounded-full bg-primary text-primary-foreground text-xs font-bold font-sans">Back to List</button>
        </div>
      `;
    }
  });
</script>

{% if !auth_enabled %}
<script>
  const DB_NAME = 'my_news_guest_db';
  const STORE_NAME = 'read_entries';
  let readSet = new Set();

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function initGuestDb() {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('all_articles')) {
        db.createObjectStore('all_articles', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const getAllReq = store.getAllKeys();
      getAllReq.onsuccess = (ev) => {
        readSet = new Set(ev.target.result);
        syncDomReadStates();
        cacheLoadedArticlesFromDom();
      };
    };
  }

  function cacheLoadedArticlesFromDom() {
    const rows = document.querySelectorAll('#entries-list .annuaire-row');
    if (!rows || rows.length === 0) return;
    const articlesToSave = [];
    rows.forEach(row => {
      const id = row.getAttribute('data-entry-id');
      const numId = Number(id);
      if (!numId) return;
      const titleEl = row.querySelector('.article-title');
      const title = titleEl ? titleEl.textContent.trim() : '';
      const linkEl = row.querySelector('a[title="Open in browser"]');
      const url = linkEl ? linkEl.getAttribute('href') : '';
      articlesToSave.push({ id: numId, title, url, saved_at: Date.now() });
    });

    if (articlesToSave.length === 0) return;
    const req = indexedDB.open(DB_NAME, 2);
    req.onsuccess = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('all_articles')) return;
      const tx = db.transaction('all_articles', 'readwrite');
      const store = tx.objectStore('all_articles');
      articlesToSave.forEach(art => {
        store.put(art);
      });
    };
  }

  function renderLocalAllArticles() {
    const req = indexedDB.open(DB_NAME, 2);
    req.onsuccess = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('all_articles')) return;
      const tx = db.transaction('all_articles', 'readonly');
      const store = tx.objectStore('all_articles');
      const getAllReq = store.getAll();
      getAllReq.onsuccess = (ev) => {
        const articles = ev.target.result || [];
        const list = document.getElementById('entries-list');
        if (!list) return;
        if (articles.length === 0) {
          list.innerHTML = `
            <div id="client-empty-state" class="flex flex-col items-center justify-center p-12 text-center text-muted-foreground">
              <i data-lucide="inbox" class="w-12 h-12 mb-3 stroke-1 text-muted-foreground/60"></i>
              <p class="text-sm font-medium font-sans">No saved titles</p>
              <p class="text-xs text-muted-foreground mt-1 font-sans">Articles you load will appear here.</p>
            </div>
          `;
        } else {
          articles.sort((a, b) => b.id - a.id);
          list.innerHTML = articles.map(art => `
            <div class="annuaire-row ar-list-item relative px-4 py-2.5 rounded-lg flex items-center justify-between gap-1.5 cursor-pointer select-none group hover:bg-muted/60 transition-colors border-b border-border/60 last:border-b-0" id="entry-${art.id}" data-entry-id="${art.id}">
              <div id="entry-${art.id}-bar" class="w-[3px] self-stretch rounded-full shrink-0 bg-transparent"></div>
              <div class="flex items-center gap-1.5 flex-1 min-w-0" onclick="openEntryDetail(${art.id})">
                <span id="entry-${art.id}-dot" class="inline-flex shrink-0 empty:hidden"></span>
                <span class="article-title text-sm font-medium font-sans leading-snug line-clamp-2 text-foreground group-hover:text-foreground/80 transition-colors">
                  ${escapeHtml(art.title)}
                </span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <a 
                  href="${escapeHtml(art.url)}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  onclick="event.stopPropagation(); markArticleRead(${art.id})" 
                  class="p-1.5 rounded-full hover:bg-muted text-muted-foreground hover:text-foreground transition-colors"
                  title="Open in browser">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-muted-foreground/60 group-hover:text-foreground transition-colors"></i>
              </div>
            </div>
          `).join('');
        }
        if (window.lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons({ root: list });
        }
        syncDomReadStates();
      };
    };
  }

  function syncDomReadStates() {
    let visibleUnreadRowCount = 0;
    const activeStatusInput = document.getElementById('active-status');
    const isUnreadFilter = activeStatusInput && activeStatusInput.value === 'unread';
    const rows = document.querySelectorAll('#entries-list .annuaire-row');

    rows.forEach(row => {
      const idStr = row.getAttribute('data-entry-id');
      if (idStr) {
        const isRead = readSet.has(Number(idStr));
        const bar = document.getElementById('entry-' + idStr + '-bar');
        const dot = document.getElementById('entry-' + idStr + '-dot');

        if (isRead) {
          row.classList.remove('unread');
          row.classList.add('read');
          if (bar) {
            bar.classList.remove('bg-brand');
            bar.classList.add('bg-transparent');
          }
          if (dot) {
            dot.innerHTML = '';
          }
          if (isUnreadFilter) {
            row.style.display = 'none';
          } else {
            row.style.display = '';
          }
        } else {
          row.classList.remove('read');
          row.classList.add('unread');
          if (bar) {
            bar.classList.remove('bg-transparent');
            bar.classList.add('bg-brand');
          }
          if (dot && !dot.querySelector('span')) {
            dot.innerHTML = '<span class="w-2 h-2 rounded-full bg-brand shrink-0" title="Unread"></span>';
          }
          row.style.display = '';
          visibleUnreadRowCount++;
        }
      }
    });

    const filterCount = document.getElementById('filter-unread-count');
    const pill = document.getElementById('unread-pill');
    const baseServerUnread = (filterCount && filterCount.dataset.baseUnread !== undefined)
      ? parseInt(filterCount.dataset.baseUnread, 10)
      : (pill && pill.dataset.baseUnread !== undefined ? parseInt(pill.dataset.baseUnread, 10) : 0);
    const effectiveUnread = Math.max(0, baseServerUnread - readSet.size);

    if (pill) {
      pill.textContent = effectiveUnread + ' unread';
    }
    if (filterCount) {
      filterCount.textContent = '(' + effectiveUnread + ')';
    }

    let emptyEl = document.getElementById('client-empty-state');
    if (isUnreadFilter && visibleUnreadRowCount === 0 && rows.length > 0) {
      if (!emptyEl) {
        emptyEl = document.createElement('div');
        emptyEl.id = 'client-empty-state';
        emptyEl.className = 'flex flex-col items-center justify-center p-12 text-center text-muted-foreground';
        emptyEl.innerHTML = `
          <i data-lucide="inbox" class="w-12 h-12 mb-3 stroke-1 text-muted-foreground/60"></i>
          <p class="text-sm font-medium font-sans">All caught up!</p>
          <p class="text-xs text-muted-foreground mt-1 font-sans">No articles match your current filter.</p>
        `;
        const list = document.getElementById('entries-list');
        if (list) list.appendChild(emptyEl);
        if (window.lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons({ root: emptyEl });
        }
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
  }

  function markLocallyRead(id) {
    const numId = Number(id);
    if (!numId) return;
    readSet.add(numId);
    syncDomReadStates();
    if (typeof invalidateFilterCache === 'function') {
      invalidateFilterCache();
    }
    const req = indexedDB.open(DB_NAME, 2);
    req.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put({ id: numId, read_at: Date.now() });
    };
  }

  function unmarkLocallyRead(id) {
    const numId = Number(id);
    if (!numId) return;
    readSet.delete(numId);
    syncDomReadStates();
    if (typeof invalidateFilterCache === 'function') {
      invalidateFilterCache();
    }
    const req = indexedDB.open(DB_NAME, 2);
    req.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(numId);
    };
  }

  function toggleLocalReadStatus(id) {
    const numId = Number(id);
    if (!numId) return;
    if (readSet.has(numId)) {
      unmarkLocallyRead(numId);
    } else {
      markLocallyRead(numId);
    }
    if (typeof invalidateFilterCache === 'function') {
      invalidateFilterCache();
    }
  }

  function markVisiblePageLocallyRead() {
    const ids = (typeof getVisibleEntryIds === 'function') ? getVisibleEntryIds() : [];
    if (Array.isArray(ids) && ids.length > 0) {
      ids.forEach(id => markLocallyRead(id));
    } else {
      document.querySelectorAll('.annuaire-row').forEach(row => {
        const id = row.getAttribute('data-entry-id');
        if (id) markLocallyRead(id);
      });
    }
    if (typeof invalidateFilterCache === 'function') {
      invalidateFilterCache();
    }
  }

  function showToast(message) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'pointer-events-auto shadow-float rounded-full bg-foreground text-background pl-4 pr-2.5 py-2 flex items-center gap-2.5 text-xs font-bold font-sans transition-opacity duration-300';
    toast.innerHTML = '<i data-lucide="bookmark" class="w-4 h-4 text-brand shrink-0"></i><span>' + message + '</span><button type="button" onclick="dismissToast(this)" class="p-1 rounded-full text-background/60 hover:text-background hover:bg-background/20 transition-colors shrink-0" title="Close notification" aria-label="Close notification"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>';
    container.appendChild(toast);
    if (window.lucide && typeof lucide.createIcons === 'function') {
      lucide.createIcons({ root: toast });
    }
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function triggerNativeBookmark(title, url) {
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied to clipboard for bookmarking');
      }).catch(() => {
        showToast('Press Cmd+D / Ctrl+D to bookmark');
      });
    } else {
      showToast('Press Cmd+D / Ctrl+D to bookmark');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initGuestDb();
  });

  document.addEventListener('htmx:afterSwap', (evt) => {
    if (evt.detail && evt.detail.target) {
      if (evt.detail.target.id === 'entries-list') {
        cacheLoadedArticlesFromDom();
      } else if (evt.detail.target.id === 'detail-panel') {
        const detail = evt.detail.target.querySelector('[data-entry-id]');
        if (detail) {
          const id = detail.getAttribute('data-entry-id');
          if (id) markLocallyRead(id);
        }
      }
    }
    syncDomReadStates();
  });
</script>
{% endif %}
