services:
  my-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-ui
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - my_ui_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  my_ui_data:
    driver: local
