{% extends "base.html" %}

{% block title %}Directory | My News{% endblock %}

{% block content %}
<div class="spatial-shell">
  <main class="spatial-window flex flex-col bg-card border border-border">
    <!-- Header -->
    <header class="h-14 px-6 border-b border-border grid grid-cols-[1fr_auto_1fr] items-center shrink-0 select-none bg-card">
      <div class="flex items-center gap-3">
        <span class="font-display text-xl font-bold uppercase tracking-wider text-brand">My News</span>
        <span id="unread-pill" class="px-2.5 py-0.5 rounded-full bg-muted border border-border text-foreground font-bold text-xs tabular">
          {{ unread_count }} unread
        </span>
      </div>

      <div class="flex justify-center">
        <div class="w-12 h-1 bg-border rounded-full"></div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <!-- Theme Switcher (Frontier Q2: Sun/Moon toggle with OS auto-detect) -->
        <button 
          id="theme-toggle-btn"
          type="button" 
          onclick="toggleTheme()" 
          class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" 
          title="Toggle light/dark theme">
          <i data-lucide="sun" id="theme-icon-sun" class="w-4 h-4 hidden"></i>
          <i data-lucide="moon" id="theme-icon-moon" class="w-4 h-4"></i>
        </button>

        <button 
          id="mark-page-read-btn"
          type="button" 
          hx-post="/hx/mark-page-read" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="#active-status, [name='search']"
          hx-vals="js:{entry_ids: getVisibleEntryIds()}"
          class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" 
          title="Mark This Page as Read">
          <i data-lucide="check-check" class="w-4 h-4"></i>
        </button>
        <a href="/auth/logout" class="p-2 rounded-full border border-border bg-card hover:bg-muted text-foreground transition-colors" title="Log Out">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </a>
      </div>
    </header>

    <!-- Filter Bar & Search -->
    <div class="px-6 py-3 border-b border-border flex items-center justify-between gap-4 bg-muted/40">
      <input type="hidden" id="active-status" name="status" value="unread">
      <div class="flex items-center gap-2">
        {% if ai_enabled %}
        <button 
          id="filter-ai"
          data-status="ai"
          hx-get="/hx/entries?status=ai" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-foreground"></i>
          AI
        </button>
        {% endif %}
        <button 
          id="filter-unread"
          data-status="unread"
          hx-get="/hx/entries?status=unread" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-bold bg-primary text-primary-foreground border border-primary transition-colors">
          Unread <span id="filter-unread-count" class="text-xs tabular">({{ unread_count }})</span>
        </button>
        <button 
          id="filter-today"
          data-status="today"
          hx-get="/hx/entries?status=today" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors">
          Today <span id="filter-today-count" class="text-xs tabular">({{ today_count }})</span>
        </button>
        <button 
          id="filter-starred"
          data-status="starred"
          hx-get="/hx/entries?status=starred" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors">
          Starred
        </button>
        <button 
          id="filter-all"
          data-status="all"
          hx-get="/hx/entries?status=all" 
          hx-target="#entries-list" 
          hx-swap="innerHTML" 
          hx-include="[name='search']"
          onclick="setActiveFilter(this)"
          class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground hover:bg-border border border-border transition-colors">
          All Titles
        </button>
      </div>

      <!-- Annuaire Recipe 6.3: Search Form with .field and .field-button-hit-area -->
      <form 
        id="search-form" 
        hx-get="/hx/entries" 
        hx-target="#entries-list" 
        hx-swap="innerHTML"
        class="relative flex items-center"
        onsubmit="onSearchSubmit(event)"
      >
        <input 
          type="search" 
          id="search-input"
          name="search" 
          placeholder="Filter articles..." 
          oninput="filterArticlesClientSide(this.value)"
          class="field rounded-full border border-input bg-card pl-3.5 pr-8 py-1.5 text-xs text-foreground placeholder:text-muted-foreground w-48"
        />
        <input type="hidden" name="status" value="all" />
        <button type="submit" class="field-button-hit-area absolute right-2.5 text-muted-foreground hover:text-foreground" title="Search all articles">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </button>
      </form>
    </div>

    <!-- Main Content Area: Entries List + Detail Panel Container -->
    <div class="flex-1 flex overflow-hidden relative">
      <div id="entries-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-1.5 bg-card">
        {{ entries_list_html|safe }}
      </div>

      <!-- Detail Slide-Over / Modal Panel (Annuaire: zero shadow, border-l border-border) -->
      <div id="detail-panel" class="detail-scrollbar hidden absolute inset-0 z-30 bg-card border-l border-border flex flex-col p-6 overflow-y-auto"></div>
    </div>
  </main>
</div>

<script>
  function setActiveFilter(btn) {
    document.querySelectorAll('.filter-pill').forEach(el => {
      el.classList.remove('bg-primary', 'text-primary-foreground', 'font-bold', 'border-primary');
      el.classList.add('bg-muted', 'text-muted-foreground', 'border-border', 'font-medium');
    });
    btn.classList.remove('bg-muted', 'text-muted-foreground', 'border-border', 'font-medium');
    btn.classList.add('bg-primary', 'text-primary-foreground', 'font-bold', 'border-primary');
    const status = btn.getAttribute('data-status');
    const statusInput = document.getElementById('active-status');
    if (status && statusInput) {
      statusInput.value = status;
    }
  }

  function filterArticlesClientSide(query) {
    const q = (query || '').toLowerCase().trim();
    const items = document.querySelectorAll('#entries-list .annuaire-row, #entries-list .ar-list-item');
    items.forEach(item => {
      const titleEl = item.querySelector('.article-title') || item;
      const title = titleEl.textContent.toLowerCase();
      if (!q || title.includes(q)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  }

  function getVisibleEntryIds() {
    const items = document.querySelectorAll('#entries-list .annuaire-row, #entries-list .ar-list-item');
    const ids = [];
    items.forEach(item => {
      if (item.style.display !== 'none') {
        const id = item.getAttribute('data-entry-id') || (item.id ? item.id.replace('entry-', '') : null);
        if (id) ids.push(id);
      }
    });
    return ids.join(',');
  }

  function onSearchSubmit(event) {
    // Allows HTMX to proceed with GET /hx/entries?search=...&status=all
  }

  function openDetailWithSkeleton() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    
    panel.innerHTML = `
      <div class="flex flex-col h-full animate-pulse select-none w-full">
        <!-- Skeleton Header: fixed h-8 matching real detail header, no vertical jump -->
        <div class="flex items-center justify-between mb-6 shrink-0 w-full h-8">
          <button 
            type="button"
            onclick="closeDetailPanel()" 
            class="h-8 px-3 inline-flex items-center gap-1.5 rounded-full bg-primary text-primary-foreground text-xs font-bold pointer-events-auto shrink-0">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
          </button>
          <div class="flex items-center gap-2 h-8 shrink-0">
            <div class="h-8 w-20 bg-muted rounded-full shrink-0"></div>
            <div class="w-8 h-8 rounded-full bg-muted shrink-0"></div>
            <div class="w-8 h-8 rounded-full bg-muted shrink-0"></div>
          </div>
        </div>

        <!-- Skeleton Body: centered and capped at max-w-[44rem] -->
        <div class="detail-scrollbar flex-1 overflow-y-auto pr-2 space-y-4 w-full max-w-[44rem] mx-auto">
          <!-- Feed info & date -->
          <div class="flex items-center gap-2 mb-2">
            <div class="h-3.5 bg-muted rounded w-28"></div>
            <div class="h-3.5 bg-muted rounded w-16"></div>
          </div>

          <!-- Title placeholder -->
          <div class="space-y-2 mb-6">
            <div class="h-6 bg-muted rounded w-4/5"></div>
            <div class="h-6 bg-muted rounded w-2/3"></div>
          </div>

          <!-- AI Brief Card Skeleton -->
          <div class="rounded-lg border border-border bg-muted/40 p-4 space-y-2.5">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-4 h-4 rounded bg-primary/20"></div>
              <div class="h-3.5 bg-muted rounded w-24"></div>
            </div>
            <div class="h-3 bg-muted rounded w-full"></div>
            <div class="h-3 bg-muted rounded w-5/6"></div>
          </div>

          <!-- Prose Content Skeleton Lines -->
          <div class="space-y-3 pt-2">
            <div class="h-4 bg-muted rounded w-full"></div>
            <div class="h-4 bg-muted rounded w-11/12"></div>
            <div class="h-4 bg-muted rounded w-4/5"></div>
            <div class="h-4 bg-muted rounded w-full"></div>
            <div class="h-4 bg-muted rounded w-3/4"></div>
          </div>
        </div>
      </div>
    `;
    panel.classList.remove('hidden');
  }

  function closeDetailPanel() {
    const panel = document.getElementById('detail-panel');
    if (!panel) return;
    panel.classList.add('hidden');
    panel.innerHTML = '';
    const url = new URL(window.location);
    if (url.searchParams.has('entry')) {
      url.searchParams.delete('entry');
      history.pushState(null, '', url.pathname + (url.search ? url.search : ''));
    } else if (window.location.pathname.startsWith('/entries/')) {
      history.pushState(null, '', '/');
    }
  }

  function checkUrlForEntry() {
    const urlParams = new URLSearchParams(window.location.search);
    let entryId = urlParams.get('entry');
    if (!entryId) {
      const match = window.location.pathname.match(/\/entries\/(\d+)/);
      if (match) {
        entryId = match[1];
      }
    }
    if (entryId) {
      openDetailWithSkeleton();
      htmx.ajax('GET', '/hx/entries/' + encodeURIComponent(entryId), {
        target: '#detail-panel',
        swap: 'innerHTML'
      });
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    checkUrlForEntry();
  });

  window.addEventListener('popstate', () => {
    const urlParams = new URLSearchParams(window.location.search);
    let entryId = urlParams.get('entry');
    if (!entryId) {
      const match = window.location.pathname.match(/\/entries\/(\d+)/);
      if (match) {
        entryId = match[1];
      }
    }
    if (entryId) {
      openDetailWithSkeleton();
      htmx.ajax('GET', '/hx/entries/' + encodeURIComponent(entryId), {
        target: '#detail-panel',
        swap: 'innerHTML'
      });
    } else {
      closeDetailPanel();
    }
  });
</script>
{% endblock %}
