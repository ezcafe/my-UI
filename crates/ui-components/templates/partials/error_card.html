<div class="rounded-lg p-6 bg-card border border-border text-center flex flex-col items-center justify-center m-4">
  <div class="p-2.5 rounded-full bg-muted text-destructive mb-3">
    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
  </div>
  <h3 class="text-sm font-bold font-sans text-foreground mb-1">Upstream Communication Issue</h3>
  <p class="text-xs font-sans text-muted-foreground mb-4 max-w-sm">{{ message }}</p>
  <button 
    hx-get="{{ retry_url }}" 
    hx-target="{{ target }}" 
    hx-swap="innerHTML" 
    class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-primary-foreground text-xs font-bold font-sans hover:opacity-90 transition-opacity">
    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
    <span>Retry Connection</span>
  </button>
</div>
